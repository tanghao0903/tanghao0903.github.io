<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naza Tang</title>
<meta name="description" content="欢迎访问 Naza Tang 的个人网站">
<meta name="theme-color" content="#07060b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=Noto+Sans+SC:wght@500;900&display=swap">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/cyber.css">
<style>
.hero{position:relative;z-index:4;height:100vh;height:100svh;display:grid;place-items:center;text-align:center;padding:0 16px;pointer-events:none}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 55% 40% at 50% 50%,rgba(7,6,11,.86),rgba(7,6,11,.45) 65%,transparent)}
.hello{position:relative;opacity:0;transform:scale(1.04);transition:opacity .6s,transform 1.2s cubic-bezier(.2,.7,.2,1)}
.ready .hello{opacity:1;transform:none;animation:flick 1.1s steps(1) .25s both}
@keyframes flick{0%{opacity:0}8%{opacity:1}12%{opacity:.1}18%{opacity:1;transform:translateX(-6px) skewX(-8deg)}22%{transform:none}30%{opacity:.3}36%{opacity:1}100%{opacity:1}}
.tag{display:inline-flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.32em;color:var(--cyan);border:1px solid rgba(0,240,255,.5);padding:6px 14px;background:rgba(0,240,255,.06);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);margin-bottom:22px}
.welcome{display:block;font-family:var(--cn);font-size:clamp(26px,4.2vw,48px);letter-spacing:.45em;margin-right:-.45em;color:#fff;text-shadow:0 0 6px var(--pink),0 0 22px rgba(255,43,214,.7),0 0 48px rgba(255,43,214,.4)}
.glitch{position:relative;display:inline-block;margin:10px 0 0;font-family:var(--disp);font-weight:900;font-size:clamp(52px,12vw,164px);line-height:1;letter-spacing:.04em;color:#f4fdff;
  text-shadow:0 0 4px #fff,0 0 14px var(--cyan),0 0 40px rgba(0,240,255,.65),0 0 90px rgba(0,240,255,.35)}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;inset:0;overflow:hidden}
.glitch::before{color:var(--pink);text-shadow:none;transform:translate(-3px,0);mix-blend-mode:screen;opacity:.85;animation:g1 3.2s infinite steps(1)}
.glitch::after{color:var(--cyan);text-shadow:none;transform:translate(3px,0);mix-blend-mode:screen;opacity:.85;animation:g2 2.7s infinite steps(1)}
@keyframes g1{0%{clip-path:inset(0 0 100% 0)}4%{clip-path:inset(12% 0 70% 0);transform:translate(-8px,-2px)}8%{clip-path:inset(60% 0 22% 0);transform:translate(6px,1px)}12%{clip-path:inset(0 0 100% 0)}55%{clip-path:inset(0 0 100% 0)}57%{clip-path:inset(40% 0 45% 0);transform:translate(-10px,0)}59%{clip-path:inset(0 0 100% 0)}100%{clip-path:inset(0 0 100% 0)}}
@keyframes g2{0%{clip-path:inset(0 0 100% 0)}30%{clip-path:inset(0 0 100% 0)}32%{clip-path:inset(75% 0 5% 0);transform:translate(9px,1px)}35%{clip-path:inset(20% 0 62% 0);transform:translate(-5px,-1px)}38%{clip-path:inset(0 0 100% 0)}80%{clip-path:inset(0 0 100% 0)}81%{clip-path:inset(48% 0 38% 0);transform:translate(12px,0)}83%{clip-path:inset(0 0 100% 0)}}
.sub{margin-top:20px;font-family:var(--cn);font-size:clamp(18px,2.4vw,26px);letter-spacing:.6em;margin-right:-.6em;color:var(--yellow);text-shadow:0 0 10px rgba(245,255,59,.6)}
.term{margin-top:26px;font-size:clamp(12px,1.4vw,14px);color:rgba(233,246,255,.82);letter-spacing:.08em;min-height:1.4em}
.term b{color:var(--pink);font-weight:400}
.cursor{display:inline-block;width:.6em;height:1.1em;background:var(--cyan);vertical-align:-3px;margin-left:3px;box-shadow:0 0 8px var(--cyan);animation:blink 1s steps(2) infinite}
.enter{pointer-events:auto;display:inline-block;margin-top:34px;font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.35em;color:#000;background:var(--cyan);padding:14px 30px 14px 34px;text-decoration:none;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);box-shadow:0 0 24px rgba(0,240,255,.6);transition:background .2s,box-shadow .2s,transform .2s;opacity:0}
.ready .enter{opacity:1;transition:opacity .6s 2.4s,background .2s,box-shadow .2s,transform .2s}
.enter:hover{background:var(--pink);box-shadow:0 0 34px rgba(255,43,214,.8);transform:translateY(-2px)}
.hello{will-change:opacity}
@media (prefers-reduced-motion:reduce){.ready .hello{animation:none}.glitch::before,.glitch::after,{animation:none}}
</style>
</head>
<body>
<canvas id="metal" aria-hidden="true"></canvas>
<div class="fx sweep"></div><div class="fx scan"></div><div class="fx vig"></div>
<div class="hud" aria-hidden="true">
  <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
  <span class="t t1"><span class="dot"></span>SYS://NAZAJTANG.WORK</span>
  <span class="t t2" id="clock">T --:--:--</span>
  <span class="t t3" id="coord">X 0000 · Y 0000</span>
  <span class="t t4">NEURAL LINK · ONLINE</span>
</div>

<section class="hero">
  <div class="hello">
    <div class="tag">// ACCESS GRANTED</div>
    <span class="welcome">欢迎访问</span>
    <h1 class="glitch" data-text="NAZA TANG">NAZA TANG</h1>
    <div class="sub">的个人网站</div>
    <div class="term" id="term"><span class="cursor"></span></div>
    <a class="enter" href="/projects/">ENTER ▸</a>
  </div>
</section>

<script src="/assets/metal.js"></script>
<script src="/assets/disturb.js"></script>
<script>
(function(){
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var term=document.getElementById('term'),cur=term.querySelector('.cursor');
  var lines=['&gt; 正在连接 nazajtang.work ...','&gt; 连接成功 <b>[OK]</b> 欢迎你，访客'];
  var li=0,ci=0;
  function type(){
    var L=lines[li],c=L.charAt(ci);
    if(c==='<')ci=L.indexOf('>',ci)+1;else if(c==='&')ci=L.indexOf(';',ci)+1;else ci++;
    term.innerHTML=L.slice(0,ci);term.appendChild(cur);
    if(ci<L.length)setTimeout(type,reduce?0:40);
    else if(li+1<lines.length){li++;ci=0;setTimeout(type,700);}
  }
  setTimeout(type,reduce?0:900);
})();
</script>
</body>
</html>
